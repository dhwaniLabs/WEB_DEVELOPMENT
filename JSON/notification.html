
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications | StudentSphere</title>

    <link rel="stylesheet" href="notification.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">

            <i class="fa-solid fa-graduation-cap"></i>

            <h2>StudentSphere</h2>

        </div>

        <div class="profile">

            <i class="fa-solid fa-user-circle"></i>

            <span>Dhwani</span>

        </div>

    </header>


    <!-- PAGE TITLE -->

    <section class="title-section">

        <h1>Notification Center</h1>

        <p>Stay updated with all your academic activities</p>

    </section>


    <!-- SEARCH AND CLEAR -->

    <div class="top-bar">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search notifications..."
            >

            <button id="searchBtn">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </div>


        <button class="clear-btn" id="clearBtn">

            <i class="fa-solid fa-trash"></i>

            Clear All

        </button>

    </div>


    <!-- NOTIFICATION CONTAINER -->

    <section class="notification-container" id="notificationContainer">

        <!-- Notifications will be loaded from JSON -->

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 StudentSphere | Notification Center
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="notification.js"></script>

</body>

</html>
