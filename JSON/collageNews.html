<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College News | StudentSphere</title>

    <link rel="stylesheet" href="collageNews.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <h2>StudentSphere</h2>
        </div>

        <div class="profile">
            <i class="fa-solid fa-user-circle"></i>
            <span>Dhwani</span>
        </div>

    </header>


    <!-- HERO -->

    <section class="hero">

        <h1>College News & Activities</h1>

        <p>
            Stay updated with the latest events and activities happening on campus.
        </p>

    </section>


    <!-- SEARCH -->

    <section class="search-section">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search College News..."
            >

            <button id="searchButton">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </div>

    </section>


    <!-- NEWS SECTION -->

    <section class="news-container" id="newsContainer">

        <!-- News cards will be loaded from JSON -->

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 StudentSphere | College News Portal
        </p>

    </footer>


    <script src="collageNews.js"></script>

</body>

</html>
